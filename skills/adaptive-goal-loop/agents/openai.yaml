interface:
  display_name: "Adaptive Goal Loop"
  short_description: "Run a goal with Luna and optional escalation"
  default_prompt: "Use $adaptive-goal-loop to complete this goal in the primary, selectively delegating clear, verifiable assignments to Luna when the savings justify the handoff, with automatic escalation off unless one compatible target is explicitly configured."

policy:
  allow_implicit_invocation: false

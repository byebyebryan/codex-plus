<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 690" role="img" aria-labelledby="title desc" data-source-sha256="ecc3f320ea950761a6071dfdd413a07475ae4d3926d32428b3a26eac0f29eda8">
<title id="title">Codex Plus observation and native follow-up</title>
<desc id="desc">An ordinary request reaches the model in the native conversation. Codex Plus tools register a coordinator and private journal. Permission-verified commands and passive peers supply useful observations, queued back to the same thread. Timers also queue a native turn. The model uses its normal approved MCP connection and the independent report publisher.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#185b50"/></marker></defs>
<style>text{font-family:system-ui,sans-serif;fill:#202e2c;font-size:16px}.title{font-weight:650}.sub{font-size:13px;fill:#586760}.box{fill:#fffefa;stroke:#b9c9bc;stroke-width:1.5}.owned{fill:#e7eee7}.line{fill:none;stroke:#185b50;stroke-width:2;marker-end:url(#arrow)}.label{font-size:12px;fill:#185b50}</style>
<rect width="960" height="690" rx="16" fill="#f6f4ee"/>
<rect class="box" x="305" y="25" width="290" height="58" rx="9"/><text class="title" x="450" y="60" text-anchor="middle">Your ordinary request</text>
<path class="line" d="M450 83V116"/>
<rect class="box owned" x="305" y="120" width="290" height="79" rx="9"/><text class="title" x="450" y="151" text-anchor="middle">Native conversation / model</text><text class="sub" x="450" y="177" text-anchor="middle">Existing daemon, goals and approvals</text>
<path class="line" d="M450 199V250"/><text class="label" x="467" y="230">Codex Plus MCP tools</text>
<rect class="box owned" x="305" y="255" width="290" height="78" rx="9"/><text class="title" x="450" y="286" text-anchor="middle">Bound coordinator</text><text class="sub" x="450" y="311" text-anchor="middle">Private journal, bounds and receipts</text>
<path class="line" d="M305 294H159V365"/>
<rect class="box" x="35" y="370" width="250" height="90" rx="9"/><text class="title" x="160" y="400" text-anchor="middle">Observation sources</text><text class="sub" x="160" y="427" text-anchor="middle">Native command/script permissions</text><text class="sub" x="160" y="446" text-anchor="middle">Passive same-daemon peer reads</text>
<path class="line" d="M160 460V510H305"/><text class="label" x="167" y="492">Useful observations</text>
<path class="line" d="M450 333V465"/><text class="label" x="463" y="393">Reminder or MCP inspection due</text>
<rect class="box owned" x="305" y="470" width="290" height="82" rx="9"/><text class="title" x="450" y="503" text-anchor="middle">Queued native input</text><text class="sub" x="450" y="529" text-anchor="middle">Exact continuing thread</text>
<path class="line" d="M450 552V626H15V159H301"/><text class="label" x="41" y="650">Native ordering and control → useful model follow-up</text>
<path class="line" d="M595 145H714V230"/>
<rect class="box" x="650" y="235" width="265" height="84" rx="9"/><text class="title" x="782" y="268" text-anchor="middle">Configured MCP inspection</text><text class="sub" x="782" y="296" text-anchor="middle">Normal native approval and auth</text>
<path class="line" d="M595 176H933V470H919"/>
<rect class="box" x="650" y="434" width="265" height="84" rx="9"/><text class="title" x="782" y="466" text-anchor="middle">Report request / publisher</text><text class="sub" x="782" y="494" text-anchor="middle">Independent static store and hosting</text>
<text class="sub" x="650" y="566">The coordinator schedules inspections;</text><text class="sub" x="650" y="587">the model calls the approved MCP tool.</text>
</svg>
